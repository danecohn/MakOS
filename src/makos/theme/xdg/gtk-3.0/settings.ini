# MakOS session defaults. Only MakOS sessions put this directory on XDG_CONFIG_DIRS, so Plasma/Amerika
# sessions never see it, and the user's own ~/.config/gtk-N.0/settings.ini always wins.
[Settings]
gtk-theme-name=MakOS
gtk-icon-theme-name=MakOS
gtk-cursor-theme-name=MakOS-Cursors
gtk-cursor-theme-size=24
gtk-font-name=DejaVu Sans 10
gtk-sound-theme-name=MakOS
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1
gtk-decoration-layout=close,minimize,maximize:
gtk-application-prefer-dark-theme=0
gtk-enable-animations=1
gtk-overlay-scrolling=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
