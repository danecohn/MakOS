<!doctype html><html lang="en"><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Venture</title><style>
:root{--bg:#f6f1f4;--surface:#fffbfd;--label:#17101a;--label2:#5d4e5a;--sep:#d9ccd4;--border:#857380;--tint:#a8003a;--btn:#d6004a;--hover:#ebe2e8}
@media (prefers-color-scheme:dark){:root{--bg:#120a14;--surface:#1e1422;--label:#f7eef2;--label2:#bfaebb;--sep:#3a2a3d;--border:#8f7b8b;--tint:#ff7aa6;--btn:#d6004a;--hover:#2d1f31}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--label);font:15px "Vigil Sans","DejaVu Sans",sans-serif;min-height:100vh}main{max-width:880px;margin:10vh auto;padding:40px}header{text-align:center}h1{font-size:46px;letter-spacing:-1px;font-weight:700;margin:12px}p{color:var(--label2);line-height:1.6}form{display:flex;max-width:600px;margin:32px auto 48px;gap:8px}input{flex:1;min-width:0;border:1px solid var(--border);border-radius:20px;padding:12px 18px;background:var(--surface);color:var(--label);font:inherit}input:focus{outline:3px solid var(--tint);outline-offset:1px}button{border:1px solid #a8003a;border-radius:18px;padding:9px 20px;background:var(--btn);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#b80040}button:focus-visible{outline:3px solid var(--tint);outline-offset:2px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}a{display:flex;min-height:130px;border:1px solid var(--sep);border-radius:18px;background:var(--surface);box-shadow:0 4px 14px #1e061618;align-items:center;justify-content:center;text-decoration:none;color:var(--label);font-size:18px;font-weight:700}a:hover{background:var(--hover);border-color:var(--tint)}a:focus-visible{outline:3px solid var(--tint);outline-offset:2px}footer{text-align:center;margin-top:40px;color:var(--label2);font-size:12px}
</style><main><header><img src="vigilos.svg" width="64" height="64" alt="VigilOS"><h1>Venture</h1><p>A window to the web.</p></header><form action="https://duckduckgo.com/" method="get"><input name="q" aria-label="Search the web" placeholder="Search the web" autofocus><button>Search</button></form><nav><a href="https://www.wikipedia.org/">Wikipedia</a><a href="https://www.openstreetmap.org/">OpenStreetMap</a><a href="https://github.com/danecohn/MakOS">VigilOS</a></nav><footer>Venture for VigilOS · A product of VigilTech, vigiltech.org</footer></main></html>
